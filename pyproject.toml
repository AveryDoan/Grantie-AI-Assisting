[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-nt-grant-assist"
version = "0.1.0"
description = "Decision-support backend for grants officers. The AI suggests; officers decide. Synthetic data only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.10",
    "google-genai>=1.0",
    "httpx>=0.27",
    "textstat>=0.7",
    "rapidfuzz>=3.9",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "seed*", "eval*"]
