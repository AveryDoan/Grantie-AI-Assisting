[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-nt-grant-assist"
version = "0.1.0"
description = "Decision-support backend for grants officers. The AI suggests; officers decide. Synthetic data only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.10",
    "google-genai>=1.0",
    "httpx>=0.27",
    "textstat>=0.7",
    "rapidfuzz>=3.9",
    "pyjwt[crypto]>=2.8",
]


[project.optional-dependencies]
dev = ["pytest>=8", "psycopg[binary]>=3.2", "pypdf>=4"]
# Local-only PII detection (versions checked on PyPI, Oct 2026). Presidio now
# lives at github.com/data-privacy-stack/presidio. Do NOT add cloud extras
# (azure-*, langextract, transformers). Install the spaCy model separately:
#   pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
redaction = ["presidio-analyzer==2.2.364", "presidio-anonymizer==2.2.364", "spacy==3.8.16",
             "pdfplumber==0.11.10", "pyyaml>=6.0.3", "cryptography>=46"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "seed*", "eval*", "redaction*"]
